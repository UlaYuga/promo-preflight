name: CI

on:
  push:
    branches:
      - main
      - claude/**
      - codex/**
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: preflight
          POSTGRES_PASSWORD: preflight
          POSTGRES_DB: preflight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U preflight -d preflight"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://preflight:preflight@localhost:5432/preflight

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run schema:check
      - run: npm run db:migrate
      - run: npm run db:check
      - run: npm run test
      - run: npm run rules:check
      - run: npm run owners:check
      - run: npm run i18n:check
      - run: npm run versioning:check
      - run: npm run ai:check
      - run: npm run checks:run

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t preflight:ci .
